# Render Blueprint for the AGRO AI API (backend only). NOT deployed yet; autoDeployTrigger is off.
# The frontend goes to Netlify (see netlify.toml).
#
# IMPORTANT free-tier facts (https://render.com/docs/free):
#  * the disk is EPHEMERAL: SQLite files and uploaded images are LOST on every restart / spin-down / redeploy
#    -> use a hosted PostgreSQL (DATABASE_URL). Images need external storage before real use (see README "Known limits").
#  * the service sleeps after 15 min idle; the first request then takes ~1 min.
services:
  - type: web
    name: agroai-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: off
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations run on every start (idempotent), then a single worker (memory!). --proxy-headers = real client IP behind Render's proxy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION          # full x.y.z required by Render; 3.14 is what the test-suite runs on
        value: 3.14.3
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY              # random, generated by Render
        generateValue: true
      - key: DATABASE_URL            # hosted PostgreSQL URL (postgres:// is converted automatically)
        sync: false
      - key: FRONTEND_URL            # https://YOUR-SITE.netlify.app
        sync: false
      - key: BACKEND_URL             # https://agroai-api.onrender.com
        sync: false
      - key: CORS_ORIGINS            # https://YOUR-SITE.netlify.app   (exact, no trailing slash)
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE         # "none" because Netlify and Render are different sites; use "lax" with a custom parent domain or the Netlify proxy
        value: none
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_BACKEND           # brevo (HTTPS API; Render Free blocks SMTP ports) | smtp | console
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID          # Google sign-in (optional): redirect URI = BACKEND_URL + /api/v1/auth/google/callback
        sync: false
      - key: GOOGLE_CLIENT_SECRET      # secret: Render only, never Netlify
        sync: false
      - key: GEMINI_API_KEY_1          # two Gemini keys: used alternately (DB counter) with automatic failover
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY              # optional generative fallback 1 (after Gemini fails)
        sync: false
      - key: POLLINATIONS_API_KEY      # optional generative fallback 2 (after Groq fails)
        sync: false
      - key: PLANTNET_API_KEY          # specialist providers (optional; skipped when unset): plant identification
        sync: false
      - key: PLANTIX_API_KEY           # crop disease analysis
        sync: false
      - key: KINDWISE_API_KEY          # crop.health
        sync: false
      - key: GEMINI_API_KEY            # legacy single-key name, still read as key 1 when GEMINI_API_KEY_1 is empty
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ML_THREADS
        value: "1"
      - key: ML_MAX_CONCURRENCY
        value: "1"
      - key: AI_MAX_CONCURRENCY
        value: "2"
      - key: UPLOAD_DIR
        value: /tmp/agroai-uploads
